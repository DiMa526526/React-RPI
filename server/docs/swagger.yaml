openapi: 3.0.0
info:
  title: Housing Rental API
  version: 1.0.0
  description: API для работы с предложениями, отзывами и пользователями
servers:
  - url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Users
  - name: Offers
  - name: Reviews
paths:
  /register:
    post:
      summary: Регистрация пользователя
      tags:
        - Users
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                username:
                  type: string
                  example: Gayle.Brekke54
                email:
                  type: string
                  format: email
                  example: Muriel.Gottlieb99@yahoo.com
                password:
                  type: string
                  example: YIdGvKcfKm
                avatar:
                  type: string
                  format: binary
                  description: Аватар пользователя (опционально)
      responses:
        "201":
          description: Пользователь успешно зарегистрирован
        "400":
          description: Ошибка валидации данных
  /login:
    post:
      summary: Авторизация пользователя
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: Carolyn.Buckridge-Sanford@yahoo.com
              password: KTSGNedPvd
      responses:
        "200":
          description: Успешный логин, возвращает токен
        "400":
          description: Неверные email или пароль
    get:
      summary: Проверка авторизации
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Пользователь авторизован
        "401":
          description: Не авторизован
  /logout:
    delete:
      summary: Выход пользователя
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Успешно вышли
        "401":
          description: Не авторизован
  /offers:
    get:
      summary: Получить все предложения
      tags:
        - Offers
      responses:
        "200":
          description: Список всех предложений
    post:
      summary: Создание нового предложения
      description: >
        Создает новое предложение (offer). Принимает данные в формате
        multipart/form-data. Поле previewImage обязательно. Поле photos — массив
        из 6 файлов.
      tags:
        - Offers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - city
                - price
                - rooms
                - guests
                - previewImage
              properties:
                title:
                  type: string
                  example: suppellex caritas delinquo
                description:
                  type: string
                  example: Theca vomer cimentarius candidus uredo cupio distinctio cicuta tribuo.
                    Vos patruus degero bene callide atque bos dens depromo.
                    Eaque vulgus contigo bos delectus claro tabula statua
                    calamitas.
                publishDate:
                  type: string
                  format: date
                  example: 2026-03-24
                city:
                  type: string
                  example: Paris
                isPremium:
                  type: boolean
                  example: true
                isFavorite:
                  type: boolean
                  example: false
                rating:
                  type: number
                  example: 2.2
                type:
                  type: string
                  enum:
                    - apartment
                    - house
                    - room
                    - hotel
                  example: hotel
                rooms:
                  type: integer
                  example: 1
                guests:
                  type: integer
                  example: 1
                price:
                  type: number
                  example: 174
                features:
                  type: string
                  description: JSON-строка массива из значений 'Air conditioning', 'Laptop
                    friendly workspace', 'Washer', 'Towels', 'Fridge'
                  example: '["Air conditioning","Laptop friendly workspace", "Washer","Towels","Fridge"]'
                commentsCount:
                  type: integer
                  example: 42
                latitude:
                  type: number
                  example: 79.5502
                longitude:
                  type: number
                  example: 26.5944
                previewImage:
                  type: string
                  format: binary
                  description: Основное изображение (обязательно)
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Дополнительные изображения
      responses:
        "201":
          description: Предложение успешно создано
        "400":
          description: Ошибка валидации данных
        "401":
          description: Не авторизован
  /offers/{id}:
    get:
      summary: Получить полное предложение по ID
      tags:
        - Offers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Полная информация о предложении
        "404":
          description: Предложение не найдено
  /offers/favorite/{offerId}/{status}:
    post:
      summary: Переключить избранное
      tags:
        - Offers
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: path
          required: true
          schema:
            type: boolean
            enum:
              - true
              - false
      responses:
        "200":
          description: Статус избранного успешно обновлен
        "401":
          description: Не авторизован
        "404":
          description: Предложение не найдено
  /reviews/{offerId}:
    get:
      summary: Получить все отзывы для предложения
      tags:
        - Reviews
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Список отзывов
        "404":
          description: Предложение не найдено
    post:
      summary: Добавить новый отзыв
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
                - rating
              properties:
                comment:
                  type: string
                  example: Solitudo nulla decretum capio spiritus despecto necessitatibus. Dolorem
                    cometes animus cura uter. Addo excepturi vinculum vomito
                    curiositas cuppedia delectus.
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                  example: 4
      responses:
        "201":
          description: Отзыв успешно создан
        "400":
          description: Ошибка валидации данных
        "401":
          description: Не авторизован
        "404":
          description: Предложение не найдено
